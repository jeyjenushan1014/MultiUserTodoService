name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Lint, Build, Test and Migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
      POSTGRES_DB: todo_db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://todo_user:${{secrets.POSTGRES_PASSWORD}}@localhost:5432/todo_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{secrets.JWT_SECRET}}
      JWT_EXPIRES_IN_SECONDS: 900
      CACHE_TTL_SECONDS: 60
      LOG_LEVEL: silent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          PORT=3000
          POSTGRES_USER=todo_user
          POSTGRES_PASSWORD=${{secrets.POSTGRES_PASSWORD}}
          POSTGRES_DB=todo_db
          POSTGRES_PORT=5432
          DATABASE_URL=postgres://todo_user:${{secrets.POSTGRES_PASSWORD}}@localhost:5432/todo_db
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=${{secrets.JWT_SECRET}}
          JWT_EXPIRES_IN_SECONDS=900
          CACHE_TTL_SECONDS=60
          LOG_LEVEL=silent
          EOF

      - name: Run database migrations
        run: npm run migrate

      - name: Verify migrations are repeatable
        run: npm run migrate

      - name: Run linting
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Start application
        shell: bash
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Verify health endpoint
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3000/health > health-response.json; then
              cat health-response.json
              exit 0
            fi

            echo "Waiting for the API to start: attempt ${attempt}/20"
            sleep 2
          done

          echo "Application failed to become healthy"
          cat server.log
          exit 1

      - name: Show application logs after failure
        if: failure()
        shell: bash
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: multi-user-todo-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
