name: CI Pipeline

on:
  push:
    branches:
      - main
      - task-3-microservices

  pull_request:
    branches:
      - main
      - task-3-microservices

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      account-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: account_user
          POSTGRES_PASSWORD: account_password
          POSTGRES_DB: account_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U account_user -d account_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      todo-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_password
          POSTGRES_DB: todo_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      PORT: 3000

      ACCOUNT_DATABASE_URL: postgres://account_user:account_password@localhost:5432/account_db
      TODO_DATABASE_URL: postgres://todo_user:todo_password@localhost:5433/todo_db

      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672

      RABBITMQ_EXCHANGE: todo.events
      RABBITMQ_DEAD_LETTER_EXCHANGE: todo.events.dlx
      RABBITMQ_NOTIFICATION_QUEUE: todo.notifications
      RABBITMQ_NOTIFICATION_DLQ: todo.notifications.dlq
      RABBITMQ_NOTIFICATION_DLQ_ROUTING_KEY: notification.failed

      TODO_HISTORY_QUEUE: todo.history
      TODO_HISTORY_DLQ: todo.history.dlq

      ACCOUNT_SERVICE_URL: http://localhost:3001
      TODO_SERVICE_URL: http://localhost:3002

      INTERNAL_SERVICE_SECRET: test-internal-secret-value-32-characters
      JWT_SECRET: test-jwt-secret-value-32-characters
      JWT_ISSUER: todo-account-service
      JWT_AUDIENCE: todo-platform

      LOG_LEVEL: silent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run account migrations
        run: npm run migrate -w @todo/account-service

      - name: Run TODO migrations
        run: npm run migrate -w @todo/todo-service

      - name: Verify account migrations are repeatable
        run: npm run migrate -w @todo/account-service

      - name: Verify TODO migrations are repeatable
        run: npm run migrate -w @todo/todo-service

      - name: Run lint
        run: npm run lint

      - name: Build all packages and services
        run: npm run build

      - name: Run all tests
        run: npm test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build --no-cache