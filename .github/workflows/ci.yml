name: CI Pipeline

on:
  push:
    branches:
      - main
      - task-3-microservices

  pull_request:
    branches:
      - main
      - task-3-microservices

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Lint, Build, Test and Migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      account-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: account_user
          POSTGRES_PASSWORD: ${{ secrets.ACCOUNT_POSTGRES_PASSWORD }}
          POSTGRES_DB: account_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U account_user -d account_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      todo-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: ${{ secrets.TODO_POSTGRES_PASSWORD }}
          POSTGRES_DB: todo_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U todo_user -d todo_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:8-alpine
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a $REDIS_PASSWORD ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: todo_user
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_PASSWORD }}
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      PORT: 3000

      ACCOUNT_DATABASE_URL: postgres://account_user:${{ secrets.ACCOUNT_POSTGRES_PASSWORD }}@localhost:5432/account_db
      TODO_DATABASE_URL: postgres://todo_user:${{ secrets.TODO_POSTGRES_PASSWORD }}@localhost:5433/todo_db

      REDIS_URL: redis://:${{ secrets.REDIS_PASSWORD }}@localhost:6379
      RABBITMQ_URL: amqp://todo_user:${{ secrets.RABBITMQ_PASSWORD }}@localhost:5672

      ACCOUNT_SERVICE_URL: http://localhost:3001
      TODO_SERVICE_URL: http://localhost:3002

      RABBITMQ_EXCHANGE: todo.events
      RABBITMQ_RETRY_EXCHANGE: todo.events.retry
      RABBITMQ_DEAD_LETTER_EXCHANGE: todo.events.dlx

      RABBITMQ_NOTIFICATION_QUEUE: todo.notifications
      RABBITMQ_NOTIFICATION_DLQ: todo.notifications.dlq
      RABBITMQ_NOTIFICATION_DLQ_ROUTING_KEY: notification.failed

      TODO_OWNER_QUEUE: todo.owner-projection
      TODO_OWNER_RETRY_QUEUE: todo.owner-projection.retry
      TODO_OWNER_DEAD_LETTER_QUEUE: todo.owner-projection.dlq

      TODO_HISTORY_QUEUE: todo.history
      TODO_HISTORY_DLQ: todo.history.dlq

      TODO_OUTBOX_WORKER_ID: ci-todo-outbox-worker
      TODO_OUTBOX_BATCH_SIZE: 25
      TODO_OUTBOX_POLL_INTERVAL_MS: 1000
      TODO_OUTBOX_LOCK_TIMEOUT_MS: 30000

      INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ISSUER: todo-account-service
      JWT_AUDIENCE: todo-platform

      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 604800
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 15

      DATABASE_MAX_CONNECTIONS: 10
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000
      DATABASE_QUERY_TIMEOUT_MS: 2000

      LOG_LEVEL: silent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run account migrations
        env:
          DATABASE_URL: postgres://account_user:${{ secrets.ACCOUNT_POSTGRES_PASSWORD }}@localhost:5432/account_db
        run: npm run migrate -w @todo/account-service

      - name: Run TODO migrations
        env:
          DATABASE_URL: postgres://todo_user:${{ secrets.TODO_POSTGRES_PASSWORD }}@localhost:5433/todo_db
        run: npm run migrate -w @todo/todo-service

      - name: Verify account migrations are repeatable
        env:
          DATABASE_URL: postgres://account_user:${{ secrets.ACCOUNT_POSTGRES_PASSWORD }}@localhost:5432/account_db
        run: npm run migrate -w @todo/account-service

      - name: Verify TODO migrations are repeatable
        env:
          DATABASE_URL: postgres://todo_user:${{ secrets.TODO_POSTGRES_PASSWORD }}@localhost:5433/todo_db
        run: npm run migrate -w @todo/todo-service

      - name: Run lint
        run: npm run lint

      - name: Build all packages and services
        run: npm run build

      - name: Run all tests
        run: npm test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build --no-cache